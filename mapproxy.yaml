# -------------------------------
# MapProxy example configuration.
# -------------------------------
#
# This is a minimal MapProxy configuration.
# See full_example.yaml and the documentation for more options.
#

# Starts the following services:
# Demo:
#     http://localhost:8080/demo
# WMS:
#     capabilities: http://localhost:8080/service?REQUEST=GetCapabilities&SERVICE=WMS
# WMTS:
#     capabilities: http://localhost:8080/wmts/1.0.0/WMTSCapabilities.xml
#     first tile: http://localhost:8080/wmts/osm/webmercator/0/0/0.png
# Tile service (compatible with OSM/etc.)
#     first tile: http://localhost:8080/tiles/osm/webmercator/0/0/0.png
# TMS:
#     note: TMS is not compatible with OSM/Google Maps/etc.
#     first tile: http://localhost:8080/tms/1.0.0/osm/webmercator/0/0/0.png
# KML:
#     initial doc: http://localhost:8080/kml/osm/webmercator

services:
  demo:
  tms:
    use_grid_names: true
    # origin for /tiles service
    origin: 'nw'
  kml:
      use_grid_names: true
  wmts:
  wms:
    md:
      title: MapProxy WMS Proxy
      abstract: This is a minimal MapProxy example.

layers:
  - name: osm
    title: OSM
    sources: [osm_cache]
  - name: qc_imagerie
    title: Imagerie Continue Quebec (MERN)
    sources: [qc_imagerie_cache]

caches:
  osm_cache:
    grids: [webmercator]
    sources: [osm_wms]
  qc_imagerie_cache:
    grids: [webmercator]
    format: image/jpeg
    sources: [qc_imagerie_wmts]

sources:
  osm_wms:
    type: wms
    req:
      url: http://${server}/service?
      layers: $layer
  qc_imagerie_wmts:
    type: tile
    grid: webmercator
    url: https://servicesmatriciels.mern.gouv.qc.ca/erdas-iws/ogc/wmts/Imagerie_Continue?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=Imagerie_GQ&STYLE=default&TILEMATRIXSET=GoogleMapsCompatibleExt2%%3Aepsg%%3A3857&FORMAT=image%%2Fjpeg&TILEMATRIX=%(z)s&TILEROW=%(y)s&TILECOL=%(x)s

grids:
    webmercator:
        base: GLOBAL_WEBMERCATOR

globals:
