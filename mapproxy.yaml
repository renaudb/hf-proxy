# -------------------------------
# MapProxy example configuration.
# -------------------------------
#
# This is a minimal MapProxy configuration.
# See full_example.yaml and the documentation for more options.
#

# Starts the following services:
# Demo:
#     http://localhost:8080/demo
# WMTS:
#     capabilities: http://localhost:8080/wmts/1.0.0/WMTSCapabilities.xml
#     first tile: http://localhost:8080/wmts/qc_imagerie/webmercator/0/0/0.jpeg
#     first tile: http://localhost:8080/wmts/qc_zone_chasse/webmercator/0/0/0.png
#     first tile: http://localhost:8080/wmts/qc_chasse_interdite/webmercator/0/0/0.png
#     first tile: http://localhost:8080/wmts/qc_territoires_faunique/webmercator/0/0/0.png
#     first tile: http://localhost:8080/wmts/qc_courbes_niveau/webmercator/0/0/0.png
# Tile service (compatible with OSM/etc.)
#     first tile: http://localhost:8080/tiles/qc_imagerie/webmercator/0/0/0.jpeg
#     first tile: http://localhost:8080/tiles/qc_zone_chasse/webmercator/0/0/0.png
#     first tile: http://localhost:8080/tiles/qc_chasse_interdite/webmercator/0/0/0.png
#     first tile: http://localhost:8080/tiles/qc_territoires_faunique/webmercator/0/0/0.png
#     first tile: http://localhost:8080/tiles/qc_courbes_niveau/webmercator/0/0/0.png
# TMS:
#     note: TMS is not compatible with OSM/Google Maps/etc.
#     first tile: http://localhost:8080/tms/1.0.0/qc_imagerie/webmercator/0/0/0.jpeg
#     first tile: http://localhost:8080/tms/1.0.0/qc_zone_chasse/webmercator/0/0/0.png
#     first tile: http://localhost:8080/tms/1.0.0/qc_chasse_interdite/webmercator/0/0/0.png
#     first tile: http://localhost:8080/tms/1.0.0/qc_territoires_faunique/webmercator/0/0/0.png
#     first tile: http://localhost:8080/tms/1.0.0/qc_courbes_niveau/webmercator/0/0/0.png

services:
  demo:
  tms:
    use_grid_names: true
    # origin for /tiles service
    origin: 'nw'
  wmts:

layers:
  - name: qc_imagerie
    title: Imagerie Continue Quebec (MERN)
    sources: [qc_imagerie_cache]
  - name: qc_zone_chasse
    title: Zone de chasse DA3 - SEFAQ (MERN SmartFaune)
    sources: [qc_zone_chasse_cache]
  - name: qc_chasse_interdite
    title: Chasse Interdite (MERN SmartFaune)
    sources: [qc_chasse_interdite_cache]
  - name: qc_territoires_faunique
    title: Territoires fauniques structurés (MERN SmartFaune)
    sources: [qc_territoires_faunique_cache]
  - name: qc_courbes_niveau
    title: Courbes de niveau 10m (MFFP Ecoforestier)
    sources: [qc_courbes_niveau_cache]

caches:
  qc_imagerie_cache:
    grids: [webmercator]
    format: image/jpeg
    sources: [qc_imagerie_wmts]
  qc_zone_chasse_cache:
    grids: [webmercator]
    format: image/png
    sources: [qc_zone_chasse_wms]
  qc_chasse_interdite_cache:
    grids: [webmercator]
    format: image/png
    sources: [qc_chasse_interdite_wms]
  qc_territoires_faunique_cache:
    grids: [webmercator]
    format: image/png
    sources: [qc_territoires_faunique_wms]
  qc_courbes_niveau_cache:
    grids: [webmercator]
    format: image/png
    sources: [qc_courbes_niveau_wms]

sources:
  qc_imagerie_wmts:
    type: tile
    grid: webmercator
    url: https://servicesmatriciels.mern.gouv.qc.ca/erdas-iws/ogc/wmts/Imagerie_Continue?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=Imagerie_GQ&STYLE=default&TILEMATRIXSET=GoogleMapsCompatibleExt2%%3Aepsg%%3A3857&FORMAT=image%%2Fjpeg&TILEMATRIX=%(z)s&TILEROW=%(y)s&TILECOL=%(x)s
  qc_zone_chasse_wms:
    type: wms
    wms_opts:
      version: '1.3.0'
    req:
      url: https://servicesvecto3.mern.gouv.qc.ca/geoserver/SmartFaunePub/ows?
      layers: Zone_chasse_da3_sefaq
      transparent: true
  qc_chasse_interdite_wms:
    type: wms
    wms_opts:
      version: '1.3.0'
    req:
      url: https://servicesvecto3.mern.gouv.qc.ca/geoserver/SmartFaunePub/ows?
      layers: Chasse_Interdite
      transparent: true
  qc_territoires_faunique_wms:
    type: wms
    wms_opts:
      version: '1.3.0'
    req:
      url: https://servicesvecto3.mern.gouv.qc.ca/geoserver/SmartFaunePub/ows?
      layers: TFS
      transparent: true
  qc_courbes_niveau_wms:
    type: wms
    wms_opts:
      version: '1.3.0'
    req:
      url: https://geoegl.msp.gouv.qc.ca/ws/mffpecofor.fcgi?
      layers: courbes_niveau_10m
      transparent: true

grids:
    webmercator:
        base: GLOBAL_WEBMERCATOR

globals:
